[project]
name = "pyscrap"
version = "0.1.0"
description = "Oracle DB scraper using SQLModel"
# 3.13 은 개발 기계의 버전을 적어둔 것이었고, 코드가 요구하는 수준이 아니다.
# 3.12 나 3.13 에만 있는 문법을 쓰는 곳이 없다 -- 실제 하한은 애노테이션의
# "X | None" 이라 3.10 이다. 배포 대상인 Oracle Linux 가 3.12 까지만 주고
# 3.13 패키지가 없어서 설치가 막혔다. 돌려본 것이 3.12 와 3.13 이라 그 둘만
# 적는다.
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.22",
    "oracledb>=2.4.1",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.1",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    # 운용사 ETF 구성종목이 스프레드시트로만 나오는 곳이 있다 -- NH/타임은
    # OOXML(xlsx), 키움은 아직 OLE2(xls) 라 리더가 둘 다 필요하다.
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "tenacity>=9.0.0",
    "loguru>=0.7.2",
    "typer>=0.15.1",
    "boto3>=1.34.0",
    "fastapi[standard]>=0.115.0",
    "requests>=2.32.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
# `fastapi run`'s auto-detection only looks at a fixed set of root-level
# paths (main.py, app.py, api.py, app/main.py, ...) -- our actual app lives
# one level deeper, at app/api/main.py, which none of those match. Pinning
# the dotted import path here (verified working: `fastapi run` accepts it
# directly, no root-level shim file needed) is what FastAPI Cloud's deploy
# actually uses to start the app.
entrypoint = "app.api.main:app"
