[project]
name = "pyscrap"
version = "3.0.0"
description = "Config-driven Korean financial market data pipeline (Neon PostgreSQL + OCI/R2 Parquet + DuckDB)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "httpx>=0.28.0",
    "certifi>=2024.8.30",
    "beautifulsoup4>=4.12.3",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "boto3>=1.34.0",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
api = ["fastapi[standard]>=0.115.0"]
browser = ["playwright>=1.48"]
# Only needed if running the one-off scripts/migrate_v2_to_v3.py against Oracle v2
migration = ["oracledb>=2.4.1"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["certs/*.pem"]

[tool.fastapi]
entrypoint = "app.api.main:app"
